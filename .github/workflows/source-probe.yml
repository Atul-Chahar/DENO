name: source-probe

# Nightly live smoke test of every keyless source (docs/08 Phase 5). Non-blocking:
# a failure opens an alert (red run), it never gates merges.
on:
  schedule: [{ cron: "17 4 * * *" }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12
      - name: probe
        run: uv run python scripts/probe_sources.py | tee probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: source-probe, path: probe.json }
